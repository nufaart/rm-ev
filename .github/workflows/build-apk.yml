name: Build APK & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Salin web assets dan sync ke Android
        run: |
          npm run build:web
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Siapkan file APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk rm-ev.apk

      - uses: actions/upload-artifact@v4
        with:
          name: rm-ev-apk
          path: rm-ev.apk

      - name: Buat atau perbarui GitHub Release (tag vX.Y.Z dari version.json)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./version.json').version")
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" rm-ev.apk --clobber
            gh release edit "$TAG" --latest
          else
            gh release create "$TAG" rm-ev.apk \
              --title "CYBER EV ENGINE $TAG" \
              --generate-notes \
              --latest
          fi
